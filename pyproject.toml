[project]
name = "banking-ai-portfolio"
version = "0.1.0"
description = "Five independent, AI-assisted banking AI and Databricks portfolio projects (synthetic data only)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_core", "copilot", "lakehouse", "explorer", "opsagent"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark, dbutils and display are injected by the runtime.
"projects/p2_lakehouse/databricks/*" = ["F821", "E402", "E501", "I001"]
