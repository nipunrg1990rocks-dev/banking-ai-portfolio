name: CapitalFlow 360

# Full verification for projects/p7_capitalflow360: unit and property tests, the generated case catalogue,
# the executor (API, rules, oracle), and the Playwright browser suite on Chromium, Firefox and WebKit.
on:
  pull_request:
    paths: ["projects/p7_capitalflow360/**", ".github/workflows/p7-capitalflow360.yml"]
  push:
    branches: [main]
    paths: ["projects/p7_capitalflow360/**", ".github/workflows/p7-capitalflow360.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf360-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/p7_capitalflow360

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_USER: cf360
          POSTGRES_PASSWORD: cf360
          POSTGRES_DB: cf360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cf360 -d cf360" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CF360_TEST_DATABASE_URL: postgresql+psycopg://cf360:cf360@localhost:5432/cf360_test
      CF360_E2E_DATABASE_URL: postgresql+psycopg://cf360:cf360@localhost:5432/cf360_test
      RUN_ID: CI-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            projects/p7_capitalflow360/requirements-dev.txt
            projects/p7_capitalflow360/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/p7_capitalflow360/frontend/package-lock.json

      - name: Create the test database
        run: PGPASSWORD=cf360 psql -h localhost -U cf360 -d cf360 -c "create database cf360_test"
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit, property and API tests
        run: python -m pytest
      - name: Case catalogue is reproducible
        run: |
          PYTHONPATH=backend:. python -m testkit.cases > /dev/null
          git diff --exit-code -- testkit/out/cases.json

      - name: Executor (API, rules, lifecycle, access, oracle)
        run: PYTHONPATH=backend:. python -m testkit.execute --run-id "$RUN_ID" | tee executor.log

      - name: Build the UI
        working-directory: projects/p7_capitalflow360/frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Playwright browsers
        working-directory: projects/p7_capitalflow360/frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser suite on Chromium, Firefox and WebKit
        id: browsers
        continue-on-error: true
        working-directory: projects/p7_capitalflow360/frontend
        env:
          PW_ALL_BROWSERS: "1"
          PW_JSON: ../testkit/out/playwright-${{ env.RUN_ID }}.json
          PYTHONPATH: ../backend
        run: npx playwright test

      - name: Merge executor and browser results
        if: always()
        run: |
          python -m testkit.merge_results --run "testkit/out/runs/$RUN_ID.json" \
            --playwright "testkit/out/playwright-$RUN_ID.json" --run-id "$RUN_ID" | tee merged.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          s = json.load(open(f"testkit/out/runs/{os.environ['RUN_ID']}.json"))["summary"]
          print(f"## CapitalFlow 360 run {s['run_id']}")
          print(f"- Executions: {s['executed']}, passed {s['passed']}, failed {s['failed']}")
          print(f"- Catalogue cases executed: {s.get('unique_cases_executed')} of {s.get('catalogue_cases')}")
          print(f"- Browser runs: {s.get('browser_runs')} ({', '.join(f'{k} {v}' for k, v in s.get('browser_runs_by_project', {}).items())})")
          print("- Lakehouse suite reads the committed local Spark evidence (lakehouse/evidence); Spark is not re-run here.")
          PY
      - name: Fail if anything failed
        if: always()
        run: |
          python -c "import json,os,sys; s=json.load(open(f'testkit/out/runs/{os.environ[\"RUN_ID\"]}.json'))['summary']; sys.exit(1 if s['failed'] else 0)"
          test "${{ steps.browsers.outcome }}" = "success"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf360-${{ env.RUN_ID }}
          path: |
            projects/p7_capitalflow360/testkit/out/runs/${{ env.RUN_ID }}.json
            projects/p7_capitalflow360/testkit/out/playwright-${{ env.RUN_ID }}.json
            projects/p7_capitalflow360/frontend/test-results
          if-no-files-found: warn
